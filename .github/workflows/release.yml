name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build release artifacts
        run: ./gradlew prepareRelease --console=plain
      - name: Verify release contents
        run: python tools/VerifyRelease.py
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" build/release/"$version"/* --draft --verify-tag --title "Aster $version" --notes-file docs/RELEASE_NOTES.md
